name: "Update documentation"

permissions:
  contents: read

# NOTE: no "paths" filter here, on purpose. A workflow filtered out by its paths never
# starts, so it reports no status at all — fine while nothing waits on it, useless the day
# the doc build is pinned in the branch protection rules. Filtering happens in the
# "changes" job below, which fails open, so the build is skipped rather than never run.
on:
  push:
    tags:
      - v*
    branches: [ "master" ]

  pull_request:

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  changes:
    # description: |
    #   Is there anything here to publish? Fails open: anything unclear rebuilds the site.
    #
    #   A tag push lands in that fail-open branch — a freshly created tag has no previous
    #   commit to compare against — which is what we want, since the rendered pages carry
    #   the latest release.
    name: Changes
    permissions:
      contents: read
      # A called workflow cannot hold more than its caller grants, and an omitted scope
      # is 'none': without this the run is rejected before it starts.
      pull-requests: read
    uses: go-openapi/ci-workflows/.github/workflows/changed-paths.yml@81c95ab8bb6a3e0aeccc90a7c9e5fc5b398b1244 # v0.6.0
    with:
      preset: doc
      # The preset knows the go-openapi layout — markdown anywhere, the hugo tree under
      # hack/doc-site — but not that this repo keeps reference pages under docs/, nor that
      # a change to this file changes what gets published.
      extra-paths: |
        docs/**
        .github/workflows/update-doc.yml

  build-doc:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '1'
          submodules: recursive
          # The playground is built from source here, so every directory it compiles has to be
          # among these: the command, the shared flag surface it registers (cmd/internal), and
          # the library itself.
          sparse-checkout: |
            hack/
            docs/
            cmd/genspec-wasi/
            cmd/internal/
            internal/
      -
        name: Get all tags [go-openapi repo]
        if: ${{ github.repository == 'go-openapi/codescan' }}
        run: |
          git fetch origin --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
      -
        name: Get all tags [fork]
        if: ${{ github.repository != 'go-openapi/codescan' }}
        run: |
          git remote add upstream "https://github.com/go-openapi/codescan"
          git fetch upstream --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
          git fetch origin --prune --update-shallow --tags 'refs/tags/*:refs/tags/*'
      -
        name: Initialize theme and assets
        # Both downloads end up as javascript served to every visitor, so neither is
        # taken on trust: -f so an error page is not silently written as the asset,
        # --proto '=https' --tlsv1.2 so a redirect cannot downgrade the transport, and
        # a recorded digest so we publish the bytes we reviewed and no others.
        #
        # A failed check is not necessarily an attack: bump the version and the digest
        # together, and recompute with
        #   curl -fsSL <url> | sha256sum
        env:
          RELEARN_VERSION: 9.0.3
          RELEARN_SHA256: 4e7f8931e63eb2a3a05938e5dfd47a5678447329b98b8486a2d1169cb3d1aba9
          MERMAID_VERSION: 11.16.1
          MERMAID_SHA256: 18327bef70d96fb505fe7287d9f6a7362ebf07ff6576ddfaffb1a06f3e1a2954
        run: |
          cd hack/doc-site/hugo

          fetch() {
            local url="$1" out="$2" want="$3"

            curl -fsSL --proto '=https' --tlsv1.2 -o "${out}" "${url}"
            echo "${want}  ${out}" | sha256sum -c -
          }

          # Clone theme (not committed)
          fetch "https://github.com/McShelby/hugo-theme-relearn/archive/refs/tags/${RELEARN_VERSION}.tar.gz" \
            relearn.tgz "${RELEARN_SHA256}"
          tar xf relearn.tgz
          rm -rf themes/hugo-relearn
          mv "hugo-theme-relearn-${RELEARN_VERSION}" hugo-relearn
          mv hugo-relearn themes/

          # Fetch vendored Mermaid (not committed) — the railroad shortcode needs
          # >= 11.16, newer than the theme's bundled Mermaid; served as a local
          # static asset so the rendered site makes no runtime CDN calls.
          mkdir -p themes/codescan-static/js/mermaid11
          fetch "https://cdn.jsdelivr.net/npm/mermaid@${MERMAID_VERSION}/dist/mermaid.min.js" \
            themes/codescan-static/js/mermaid11/mermaid.min.js "${MERMAID_SHA256}"
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      -
        name: Set up node
        # Pinned rather than taken from the runner image: the playground is built here
        # and nowhere else, so an image bumping its preinstalled node would move the
        # build with no change of ours. front-end-test.yml covers this version.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hack/doc-site/genspec-wasi/package-lock.json
      -
        name: Build the playground
        env:
          # The checkout is sparse, so several modules go.work names are absent and every go
          # command in the workspace would fail on them. The playground needs the root module
          # alone, which is what turning the workspace off leaves.
          GOWORK: off
        run: |
          cd hack/doc-site/genspec-wasi

          # npm ci rather than npm install: the lock file is what makes this reproducible, and a
          # doc build is not the place to pick up a new minor.
          npm ci
          npm run dist

          # The pack is served from the Hugo static tree; nothing here is committed. Fail loudly if
          # it is missing rather than publishing a page whose shortcode reports it is unbuilt.
          test -f ../hugo/themes/codescan-static/playground/assets/playground.js
          test -f ../hugo/themes/codescan-static/playground/genspec-wasi.wasm
      -
        name: Prepare config
        run: |
          # Builds a commit-dependant extra config to inject parameterization.
          # HUGO doesn't support config from the command line.
          #
          # Set specific parameters that are used in some parameterized document.
          # This is used to keep up-to-date installation instructions.
          cd hack/doc-site/hugo

          ROOT=$(git rev-parse --show-toplevel)
          VERSION_MESSAGE="Documentation set for latest master."
          REQUIRED_GO_VERSION=$(grep "^go\s" "${ROOT}"/go.mod|cut -d" " -f2)
          LATEST_RELEASE=$(git tag --list --sort -version:refname 'v*' 2>/dev/null | head -1 || echo "dev")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "    Latest release: ${LATEST_RELEASE}"
          echo "    Go version: ${REQUIRED_GO_VERSION}"
          echo "    Build time: ${BUILD_TIME}"
          echo "    Version message: ${VERSION_MESSAGE}"

          # Generate dynamic config
          cat codescan.yaml.template \
            | sed "s|{{ GO_VERSION }}|${REQUIRED_GO_VERSION}|g" \
            | sed "s|{{ LATEST_RELEASE }}|${LATEST_RELEASE}|g" \
            | sed "s|{{ VERSION_MESSAGE }}|${VERSION_MESSAGE}|g" \
            | sed "s|{{ BUILD_TIME }}|${BUILD_TIME}|g" \
            > codescan.yaml
      -
        name: Build site with Hugo
        uses: crazy-max/ghaction-hugo@d629f74d3e4a9da53050610da35a59863ab9b26c # v3.3.0
        with:
          version: v0.153.3  # <- pin the HUGO version, as they often break things
          extended: true
          args: >
            --config hugo.yaml,codescan.yaml
            --buildDrafts
            --cleanDestinationDir
            --minify
            --printPathWarnings
            --ignoreCache
            --noBuildLock
            --logLevel info
            --source ${{ github.workspace }}/hack/doc-site/hugo
      -
        name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hack/doc-site/hugo/public

  deploy-doc:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-doc
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      -
        name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      -
        name: Report URL
        run: |
          echo "::notice::Deployed doc site to ${{ steps.deployment.outputs.page_url }}"
